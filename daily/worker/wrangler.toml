# Posting-board bot for the Telegram group "Đăng bài hàng ngày". See daily/README.md.
# Deploy (owner's wrangler login, NOT the Pages-only CLOUDFLARE_API_TOKEN):
#   cd daily/worker && npx wrangler deploy
name = "ranker-posting"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
CHAT_ID = "-1004384456936"
THREADS = '{"rta":2,"rn":4}'

[[d1_databases]]
binding = "DB"
database_name = "ranker-posting"
database_id = "eb3960ce-d143-4d6a-b21d-8368958c494a"

[observability]
enabled = true

[triggers]
crons = ["0 14 * * *"]   # 21:00 Vietnam: reminder of unfinished posts
